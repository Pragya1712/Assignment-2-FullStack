<!DOCTYPE html>
<html>

<head>
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header">
    <div class="header_title">Dashboard</div>
    <nav class="header_nav">
      <span>Home</span>
      <span>Profile</span>
      <span>Logout</span>
    </nav>
  </header>

  <div class="dashboard">

    <aside class="dashboard_sidebar">
      <div>Menu 1</div>
      <div>Menu 2</div>
      <div>Menu 3</div>
    </aside>

    <main class="dashboard_main">

      <div class="dashboard_cards">
        <div class="dashboard_card">Users
          <div id="data" class="dashboard_user_list"></div>
        </div>
        <div class="dashboard_card">Orders</div>
        <div class="dashboard_card">Revenue</div>
      </div>

      <div class="dashboard_actions">
        <button id="loadBtn" onclick="loadData()">Load Data</button>
      </div>

      <div id="data" class="dashboard_data"></div>
    </main>

  </div>

  <script src="script.js"></script>
</body>

</html>
